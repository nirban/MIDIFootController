  <text x="600" y="392" font-size="17" font-weight="700" text-anchor="middle" fill="#f9fafb">ESP32-S3-N16R8</text>
  <text x="600" y="414" font-size="11" text-anchor="middle" fill="#9ca3af">16 MB flash · 8 MB OPI PSRAM</text>
  <text x="600" y="432" font-size="11" text-anchor="middle" fill="#9ca3af">native USB OTG + CH343P</text>

  <g font-size="10" fill="#a7f3d0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="500" y="158">3V3</text>
    <text x="570" y="158">GND</text>
    <text x="640" y="158">GPIO17</text>
    <text x="710" y="158">GPIO18</text>
  </g>

