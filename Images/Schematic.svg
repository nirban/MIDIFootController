  <!-- combo annotations -->
  <text x="145" y="668" font-size="10" fill="#6b7280">System combos (any profile), hold 450 ms:</text>
  <text x="145" y="684" font-size="10" fill="#6b7280">FS2 + FS7 → Wi-Fi web config AP</text>
  <text x="145" y="700" font-size="10" fill="#6b7280">FS3 + FS8 → ESP-NOW transmitter</text>

