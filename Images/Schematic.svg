<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 950" width="1200" height="950" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="950" fill="#ffffff"/>

  <!-- ================= TITLE ================= -->
  <text x="40" y="48" font-size="21" font-weight="700" fill="#111827">StageLinkX MIDI</text>
  <text x="40" y="72" font-size="13" fill="#4b5563">ESP32-S3 USB-MIDI foot controller — wiring schematic</text>
  <text x="40" y="92" font-size="11" fill="#9ca3af">ESP32_S3_MIDI/ESP_MIDI.ino</text>

  <!-- ================= NOTES ================= -->
  <rect x="830" y="700" width="300" height="150" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="846" y="722" font-size="12" font-weight="700" fill="#111827">Notes</text>
  <text x="846" y="744" font-size="11" fill="#374151">• All footswitches wired active-LOW to GND</text>
  <text x="846" y="761" font-size="11" fill="#374151">• Internal pull-ups, no external resistors:</text>
  <text x="858" y="777" font-size="10" fill="#6b7280" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">pinMode(pin, INPUT_PULLUP)</text>
  <text x="846" y="796" font-size="11" fill="#374151">• LEDs active-HIGH, one resistor per LED</text>
  <text x="846" y="813" font-size="11" fill="#374151">• R1–R10 = 470 Ω … 1 kΩ</text>
  <text x="846" y="830" font-size="11" fill="#374151">• GPIO 35/36/37 unused (octal PSRAM / flash)</text>
  <text x="846" y="845" font-size="11" fill="#374151">• GPIO 19/20 reserved for native USB</text>

  <!-- ================= OLED ================= -->
  <rect x="420" y="40" width="380" height="60" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="610" y="66" font-size="13" font-weight="700" text-anchor="middle" fill="#065f46">SH1106  128 × 64  I²C OLED</text>
  <text x="610" y="80" font-size="10" text-anchor="middle" fill="#047857">address auto-detect 0x3C / 0x3D  ·  U8g2 library</text>
  <text x="500" y="95" font-size="10" text-anchor="middle" fill="#065f46">VCC</text>
  <text x="570" y="95" font-size="10" text-anchor="middle" fill="#065f46">GND</text>
  <text x="640" y="95" font-size="10" text-anchor="middle" fill="#065f46">SDA</text>
  <text x="710" y="95" font-size="10" text-anchor="middle" fill="#065f46">SCL</text>

  <g stroke="#059669" stroke-width="2">
    <line x1="500" y1="100" x2="500" y2="140"/>
    <line x1="570" y1="100" x2="570" y2="140"/>
    <line x1="640" y1="100" x2="640" y2="140"/>
    <line x1="710" y1="100" x2="710" y2="140"/>
  </g>

  <!-- ================= MCU ================= -->
