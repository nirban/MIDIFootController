<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="620" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
    <marker id="arrowBoth" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <text x="40" y="40" font-size="20" font-weight="700" fill="#111827">Signal flow — wired and wireless</text>
  <text x="40" y="62" font-size="12" fill="#6b7280">Both wireless modes are runtime-only and mutually exclusive. Wi-Fi is OFF at boot.</text>

  <!-- ============ PHONE / BROWSER ============ -->
  <rect x="60" y="95" width="250" height="86" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="185" y="122" font-size="13" font-weight="700" text-anchor="middle" fill="#5b21b6">Phone or laptop browser</text>
  <text x="185" y="142" font-size="11" text-anchor="middle" fill="#6d28d9">http://192.168.4.1</text>
  <text x="185" y="160" font-size="10" text-anchor="middle" fill="#7c3aed">remap switches, actions, LEDs</text>
  <text x="185" y="174" font-size="10" text-anchor="middle" fill="#7c3aed">saved to NVS flash</text>

  <line x1="185" y1="181" x2="185" y2="248" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4" marker-start="url(#arrowBoth)" marker-end="url(#arrowBoth)"/>
  <text x="196" y="204" font-size="10" font-weight="700" fill="#5b21b6">Wi-Fi AP  ESP32-MIDI-CONFIG</text>
  <text x="196" y="218" font-size="10" fill="#6d28d9">pass esp32midi · channel 6</text>
  <text x="196" y="238" font-size="10" font-weight="700" fill="#5b21b6">hold FS2 + FS7 to toggle</text>

  <!-- ============ CONTROLLER ============ -->
  <rect x="60" y="248" width="250" height="180" rx="10" fill="#1f2937" stroke="#111827" stroke-width="2"/>
  <text x="185" y="278" font-size="15" font-weight="700" text-anchor="middle" fill="#f9fafb">StageLinkX MIDI</text>
  <text x="185" y="297" font-size="11" text-anchor="middle" fill="#9ca3af">ESP32-S3-N16R8</text>
  <line x1="80" y1="308" x2="290" y2="308" stroke="#4b5563"/>
  <text x="185" y="327" font-size="10" text-anchor="middle" fill="#d1d5db">10 footswitches · 10 LEDs</text>
  <text x="185" y="343" font-size="10" text-anchor="middle" fill="#d1d5db">SH1106 OLED status display</text>
  <text x="185" y="359" font-size="10" text-anchor="middle" fill="#d1d5db">short + long press per switch</text>
  <text x="185" y="375" font-size="10" text-anchor="middle" fill="#d1d5db">3 profiles: MODEP / Neural / Generic</text>
  <line x1="80" y1="386" x2="290" y2="386" stroke="#4b5563"/>
  <text x="185" y="404" font-size="10" text-anchor="middle" fill="#a7f3d0">ESP_MIDI.ino</text>
  <text x="185" y="419" font-size="10" text-anchor="middle" fill="#6b7280">config magic “MID2” in NVS</text>

  <!-- ============ PATH A : WIRED ============ -->
  <line x1="310" y1="290" x2="860" y2="290" stroke="#be185d" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="440" y="252" width="290" height="30" rx="6" fill="#fdf2f8" stroke="#be185d"/>
  <text x="585" y="272" font-size="11" font-weight="700" text-anchor="middle" fill="#9d174d">USB-C cable · native OTG port</text>
  <text x="585" y="308" font-size="10" text-anchor="middle" fill="#be185d">always active · appears as “ESP32-S3 MIDI FootCtrl”</text>

  <!-- ============ PATH B : WIRELESS ============ -->
  <polyline points="310,400 375,400 375,492 420,492" fill="none" stroke="#0891b2" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#arrow)"/>
  <text x="390" y="440" font-size="10" font-weight="700" fill="#155e75">hold FS3 + FS8</text>

  <rect x="420" y="462" width="310" height="118" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="575" y="484" font-size="12" font-weight="700" text-anchor="middle" fill="#155e75">ESP-NOW broadcast · Wi-Fi channel 6</text>
  <text x="575" y="502" font-size="10" text-anchor="middle" fill="#0e7490">FF:FF:FF:FF:FF:FF · unencrypted · 12-byte packet</text>
  <text x="436" y="522" font-size="10" fill="#0e7490" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">magic 0x4D494449 “MIDI” · version 1</text>
  <text x="436" y="538" font-size="10" fill="#0e7490" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">type 1=CC 2=NoteOn 3=NoteOff 4=PC</text>
  <text x="436" y="554" font-size="10" fill="#0e7490" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">seq · channel 1..16 · data1 · data2</text>
  <text x="436" y="570" font-size="10" fill="#0e7490" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">profile index</text>

  <line x1="730" y1="492" x2="800" y2="492" stroke="#0891b2" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#arrow)"/>

  <!-- receiver -->
  <rect x="800" y="440" width="230" height="120" rx="10" fill="#1f2937" stroke="#111827" stroke-width="2"/>
  <text x="915" y="466" font-size="13" font-weight="700" text-anchor="middle" fill="#f9fafb">StageLinkX Rx</text>
  <text x="915" y="483" font-size="10" text-anchor="middle" fill="#9ca3af">2nd ESP32-S3 at the Pi</text>
  <line x1="818" y1="493" x2="1012" y2="493" stroke="#4b5563"/>
  <text x="915" y="510" font-size="10" text-anchor="middle" fill="#d1d5db">validates + queues 32 packets</text>
  <text x="915" y="525" font-size="10" text-anchor="middle" fill="#d1d5db">re-emits as USB-MIDI</text>
  <text x="915" y="541" font-size="10" text-anchor="middle" fill="#86efac">WS2812 on GPIO48 flashes green</text>
  <text x="915" y="555" font-size="10" text-anchor="middle" fill="#a7f3d0">ESP32_MIDI_RX.ino</text>

  <!-- receiver up to host -->
  <polyline points="1075,440 1075,398" fill="none" stroke="#be185d" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="1030" y1="440" x2="1075" y2="440" stroke="#be185d" stroke-width="2.5"/>
  <text x="1088" y="424" font-size="10" font-weight="700" fill="#9d174d">USB-C</text>

  <!-- ============ HOST ============ -->
  <rect x="860" y="248" width="290" height="150" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text x="1005" y="276" font-size="14" font-weight="700" text-anchor="middle" fill="#14532d">Raspberry Pi · MODEP</text>
  <text x="1005" y="294" font-size="10" text-anchor="middle" fill="#166534">or laptop DAW / tablet</text>
  <line x1="878" y1="306" x2="1132" y2="306" stroke="#bbf7d0"/>
  <text x="1005" y="325" font-size="10" text-anchor="middle" fill="#166534">no drivers — class-compliant device</text>
  <text x="878" y="346" font-size="10" fill="#15803d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">aconnect -l</text>
  <text x="878" y="362" font-size="10" fill="#15803d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">aseqdump -p &lt;client:port&gt;</text>
  <text x="878" y="384" font-size="10" fill="#166534">PC ch 15 pedalboard · ch 14 snapshots + CC</text>

  <!-- ============ LEGEND ============ -->
  <rect x="60" y="450" width="250" height="130" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="76" y="470" font-size="11" font-weight="700" fill="#111827">Legend</text>
  <line x1="76" y1="486" x2="116" y2="486" stroke="#be185d" stroke-width="2.5"/>
  <text x="124" y="490" font-size="10" fill="#374151">USB cable (wired MIDI)</text>
  <line x1="76" y1="506" x2="116" y2="506" stroke="#0891b2" stroke-width="2.5" stroke-dasharray="8 5"/>
  <text x="124" y="510" font-size="10" fill="#374151">ESP-NOW radio link</text>
  <line x1="76" y1="526" x2="116" y2="526" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="124" y="530" font-size="10" fill="#374151">Wi-Fi AP (config only)</text>
  <text x="76" y="554" font-size="10" fill="#6b7280">Enabling one radio mode turns</text>
  <text x="76" y="568" font-size="10" fill="#6b7280">the other off, to save current.</text>
</svg>
